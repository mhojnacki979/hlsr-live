name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Retired 12 October 2026 after the 2027 event: the site now serves only a
      # page pointing to the results on Eyes on Score. The app source is
      # untouched — to bring it back, restore the pnpm install / build steps
      # from git history and upload ./out again.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./shutdown

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
