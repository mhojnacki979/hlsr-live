<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HLSR Archery Results — now on Eyes on Score</title>
<style>
  :root { color-scheme: dark light; --bg: #0f1b2d; --fg: #f2f4f7; --muted: #a9b4c4; --accent: #e8792b; --card: #17263d; }
  @media (prefers-color-scheme: light) { :root { --bg: #f6f7f9; --fg: #14202f; --muted: #4b5868; --card: #ffffff; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
         background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main { max-width: 460px; width: 100%; text-align: center; }
  .eyebrow { color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
  h1 { font-size: 26px; line-height: 1.25; margin: 8px 0 12px; }
  p { color: var(--muted); margin: 0 0 24px; }
  a.btn { display: block; padding: 14px 16px; margin: 0 0 12px; border-radius: 10px; background: var(--card);
          color: var(--fg); text-decoration: none; font-weight: 600; border: 1px solid rgba(232,121,43,.45); }
  a.btn:hover, a.btn:focus-visible { border-color: var(--accent); outline: none; }
  a.btn span { display: block; color: var(--muted); font-weight: 400; font-size: 14px; }
</style>
</head>
<body>
<main>
  <div class="eyebrow">Houston Livestock Show and Rodeo</div>
  <h1>2027 Archery Competition results are on Eyes on Score</h1>
  <p>This site has been retired. Final scores, qualification and brackets are kept on Eyes on Score.</p>
  <a class="btn" href="https://eyesonscore.com/bracket-tournament/2027-hlsr-archery-competition/MWNOdFN5WnJ4VFZmQThEUk9jNUVadz09">Target results<span>Qualification and elimination brackets</span></a>
  <a class="btn" href="https://eyesonscore.com/tournament/2027-hlsr-3d-archery-competition/UWcxL0RMaWx4RllZczhQU09yeVlTZz09">3D results<span>Course scores by class</span></a>
</main>
</body>
</html>
